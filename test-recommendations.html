<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Recommendations - WhatShouldIWatch.ai</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            background: #111; 
            color: #fff;
        }
        .test-section { 
            margin: 20px 0; 
            padding: 20px; 
            border: 2px solid #333; 
            border-radius: 10px;
            background: #222;
        }
        button {
            background: #6B5B95;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 16px;
        }
        button:hover { background: #5a4b7c; }
        button.active { background: #8B5CF6; }
        .recommendations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #333;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #555;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .status.success { background: #0f5132; color: #d1e7dd; }
        .status.error { background: #842029; color: #f8d7da; }
        .status.info { background: #055160; color: #cff4fc; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>🧪 Recommendation System Test</h1>
    
    <div class="test-section">
        <h2>Step 1: Select Mood</h2>
        <div id="mood-buttons">
            <button onclick="selectMood('happy')" data-mood="happy">😊 Happy</button>
            <button onclick="selectMood('chill')" data-mood="chill">😴 Chill</button>
            <button onclick="selectMood('focused')" data-mood="focused">🤔 Focused</button>
            <button onclick="selectMood('emotional')" data-mood="emotional">😢 Emotional</button>
        </div>
        <div id="mood-status" class="status hidden"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: Select Time</h2>
        <div id="time-buttons">
            <button onclick="selectTime('quick')" data-time="quick">⚡ Quick</button>
            <button onclick="selectTime('movie')" data-time="movie">🍿 Movie</button>
            <button onclick="selectTime('binge')" data-time="binge">📺 Binge</button>
            <button onclick="selectTime('episode')" data-time="episode">🎯 Episode</button>
        </div>
        <div id="time-status" class="status hidden"></div>
    </div>

    <div class="test-section">
        <h2>Step 3: Generate Recommendations</h2>
        <button onclick="testRecommendations()" id="generate-btn" disabled>🎬 Generate Recommendations</button>
        <div id="generation-status" class="status hidden"></div>
    </div>

    <div class="test-section">
        <h2>Results</h2>
        <div id="recommendations-container" class="recommendations"></div>
    </div>

    <div class="test-section">
        <h2>API Tests</h2>
        <button onclick="testTMDB()">Test TMDB API</button>
        <button onclick="testTVMaze()">Test TVMaze API</button>
        <div id="api-status" class="status hidden"></div>
    </div>

    <script>
        let selectedMood = null;
        let selectedTime = null;

        // The shows database from the main app
        const showsDatabase = {
            happy: {
                quick: [
                    {
                        title: "The Good Place",
                        type: "TV Episode",
                        platform: "netflix",
                        runtime: "22 min",
                        description: "Hilarious philosophical comedy that'll make you laugh and think",
                        image: "https://image.tmdb.org/t/p/w500/qIy1QUBhXXjTkx7cKq7e3wR8JgA.jpg",
                        rating: "9.0",
                        year: "2016",
                        aiReason: "Perfect mood booster with quick laughs and feel-good moments.",
                        watchLink: "https://netflix.com"
                    }
                ],
                movie: [
                    {
                        title: "The Princess Bride",
                        type: "Movie",
                        platform: "disney",
                        runtime: "98 min",
                        description: "Classic adventure-comedy that's pure fun for everyone",
                        image: "https://via.placeholder.com/300x450/113CCF/FFFFFF?text=Princess+Bride",
                        rating: "8.0",
                        year: "1987",
                        aiReason: "Timeless adventure with romance, comedy, and quotable lines.",
                        watchLink: "https://disneyplus.com"
                    }
                ],
                binge: [
                    {
                        title: "Ted Lasso",
                        type: "TV Series",
                        platform: "apple",
                        runtime: "3 Seasons",
                        description: "Feel-good sports comedy about optimism and kindness",
                        image: "https://via.placeholder.com/300x450/000000/FFFFFF?text=Ted+Lasso",
                        rating: "8.8",
                        year: "2020",
                        aiReason: "The ultimate feel-good binge.",
                        watchLink: "https://tv.apple.com"
                    }
                ],
                episode: [
                    {
                        title: "The Office - Dinner Party",
                        type: "TV Episode", 
                        platform: "netflix",
                        runtime: "28 min",
                        description: "One of the most hilariously cringe episodes ever made",
                        image: "https://via.placeholder.com/300x450/E50914/FFFFFF?text=The+Office",
                        rating: "9.3",
                        year: "2008",
                        aiReason: "Legendary episode that perfectly captures The Office's humor.",
                        watchLink: "https://netflix.com"
                    }
                ]
            },
            chill: {
                quick: [{
                    title: "Planet Earth II",
                    type: "Documentary",
                    platform: "netflix",
                    runtime: "50 min",
                    description: "Stunning nature documentary",
                    image: "https://via.placeholder.com/300x450/E50914/FFFFFF?text=Planet+Earth",
                    rating: "9.5",
                    year: "2016",
                    aiReason: "Breathtaking visuals and calming narration.",
                    watchLink: "https://netflix.com"
                }],
                movie: [{
                    title: "My Neighbor Totoro",
                    type: "Movie",
                    platform: "hbo",
                    runtime: "86 min", 
                    description: "Gentle Studio Ghibli magic",
                    image: "https://via.placeholder.com/300x450/8B5CF6/FFFFFF?text=Totoro",
                    rating: "8.2",
                    year: "1988",
                    aiReason: "Pure cinematic comfort food.",
                    watchLink: "https://hbomax.com"
                }],
                binge: [{
                    title: "Somebody Feed Phil",
                    type: "TV Series",
                    platform: "netflix",
                    runtime: "6 Seasons",
                    description: "Joyful food and travel show",
                    image: "https://via.placeholder.com/300x450/E50914/FFFFFF?text=Feed+Phil",
                    rating: "8.4",
                    year: "2018",
                    aiReason: "Phil's joy is infectious.",
                    watchLink: "https://netflix.com"
                }],
                episode: [{
                    title: "Bob Ross: The Joy of Painting",
                    type: "TV Episode",
                    platform: "netflix",
                    runtime: "30 min",
                    description: "The most relaxing show ever created",
                    image: "https://via.placeholder.com/300x450/E50914/FFFFFF?text=Bob+Ross",
                    rating: "9.0",
                    year: "1983",
                    aiReason: "Bob's soothing voice reduces stress.",
                    watchLink: "https://netflix.com"
                }]
            }
        };

        function selectMood(mood) {
            selectedMood = mood;
            
            // Update button styles
            document.querySelectorAll('[data-mood]').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-mood="${mood}"]`).classList.add('active');
            
            // Update status
            const status = document.getElementById('mood-status');
            status.className = 'status success';
            status.textContent = `✅ Mood selected: ${mood}`;
            status.classList.remove('hidden');
            
            checkCanGenerate();
        }

        function selectTime(time) {
            selectedTime = time;
            
            // Update button styles
            document.querySelectorAll('[data-time]').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-time="${time}"]`).classList.add('active');
            
            // Update status
            const status = document.getElementById('time-status');
            status.className = 'status success';
            status.textContent = `✅ Time selected: ${time}`;
            status.classList.remove('hidden');
            
            checkCanGenerate();
        }

        function checkCanGenerate() {
            const btn = document.getElementById('generate-btn');
            if (selectedMood && selectedTime) {
                btn.disabled = false;
                btn.style.background = '#28a745';
            }
        }

        async function testRecommendations() {
            const status = document.getElementById('generation-status');
            const container = document.getElementById('recommendations-container');
            
            status.className = 'status info';
            status.textContent = '🔄 Generating recommendations...';
            status.classList.remove('hidden');
            
            try {
                // Get base recommendations
                const categoryShows = showsDatabase[selectedMood]?.[selectedTime] || [];
                console.log('Found shows:', categoryShows);
                
                if (categoryShows.length === 0) {
                    throw new Error(`No shows found for mood: ${selectedMood}, time: ${selectedTime}`);
                }
                
                // Shuffle and take up to 3
                const shuffled = [...categoryShows].sort(() => 0.5 - Math.random());
                const recommendations = shuffled.slice(0, Math.min(3, shuffled.length));
                
                // Try to enhance with TMDB data
                const enhancedRecs = [];
                for (const show of recommendations) {
                    try {
                        const enhanced = await enhanceWithTMDB(show);
                        enhancedRecs.push(enhanced);
                    } catch (error) {
                        console.warn('Enhancement failed for:', show.title, error);
                        enhancedRecs.push(show);
                    }
                }
                
                // Display results
                displayRecommendations(enhancedRecs);
                
                status.className = 'status success';
                status.textContent = `✅ Generated ${enhancedRecs.length} recommendations successfully!`;
                
            } catch (error) {
                console.error('Error generating recommendations:', error);
                status.className = 'status error';
                status.textContent = `❌ Error: ${error.message}`;
            }
        }

        async function enhanceWithTMDB(show) {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(show.title)}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.results && data.results.length > 0) {
                        const tmdbData = data.results[0];
                        return {
                            ...show,
                            image: tmdbData.poster_path ? 
                                `https://image.tmdb.org/t/p/w500${tmdbData.poster_path}` : 
                                show.image,
                            rating: tmdbData.vote_average ? tmdbData.vote_average.toFixed(1) : show.rating,
                            description: tmdbData.overview || show.description,
                            enhanced: true
                        };
                    }
                }
            } catch (error) {
                console.warn('TMDB enhancement failed:', error);
            }
            return show;
        }

        function displayRecommendations(recommendations) {
            const container = document.getElementById('recommendations-container');
            container.innerHTML = '';
            
            recommendations.forEach(show => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${show.image}" alt="${show.title}" onerror="this.src='https://via.placeholder.com/300x200/666/fff?text=No+Image'">
                    <h3>${show.title}</h3>
                    <p><strong>Type:</strong> ${show.type}</p>
                    <p><strong>Rating:</strong> ⭐ ${show.rating}</p>
                    <p><strong>Year:</strong> ${show.year}</p>
                    <p><strong>Runtime:</strong> ${show.runtime}</p>
                    <p><strong>Platform:</strong> ${show.platform.toUpperCase()}</p>
                    <p><strong>Description:</strong> ${show.description}</p>
                    <p><strong>AI Reason:</strong> ${show.aiReason}</p>
                    ${show.enhanced ? '<p style="color: #4CAF50;">✅ Enhanced with TMDB data</p>' : '<p style="color: #ff9800;">ℹ️ Using fallback data</p>'}
                `;
                container.appendChild(card);
            });
        }

        async function testTMDB() {
            const status = document.getElementById('api-status');
            status.className = 'status info';
            status.textContent = '🔄 Testing TMDB API...';
            status.classList.remove('hidden');
            
            try {
                const response = await fetch('https://api.themoviedb.org/3/search/multi?query=Guardians of the Galaxy');
                const data = await response.json();
                
                if (response.ok && data.results && data.results.length > 0) {
                    status.className = 'status success';
                    status.textContent = `✅ TMDB API working! Found ${data.results.length} results for "Guardians of the Galaxy"`;
                    console.log('TMDB test result:', data.results[0]);
                } else {
                    status.className = 'status error';
                    status.textContent = '❌ TMDB API returned no results';
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = `❌ TMDB API error: ${error.message}`;
            }
        }

        async function testTVMaze() {
            const status = document.getElementById('api-status');
            status.className = 'status info';
            status.textContent = '🔄 Testing TVMaze API...';
            status.classList.remove('hidden');
            
            try {
                const response = await fetch('https://api.tvmaze.com/search/shows?q=The Good Place');
                const data = await response.json();
                
                if (response.ok && data.length > 0) {
                    status.className = 'status success';
                    status.textContent = `✅ TVMaze API working! Found ${data.length} results for "The Good Place"`;
                    console.log('TVMaze test result:', data[0]);
                } else {
                    status.className = 'status error';
                    status.textContent = '❌ TVMaze API returned no results';
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = `❌ TVMaze API error: ${error.message}`;
            }
        }

        // Auto-run API tests on load
        window.addEventListener('load', () => {
            console.log('🧪 Test page loaded');
            setTimeout(testTMDB, 1000);
            setTimeout(testTVMaze, 2000);
        });
    </script>
</body>
</html>
